<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>船橋支部研修旅行クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ページ1：名前入力 -->
<div id="page-start" class="page active">
  <h1>船橋支部<br>研修旅行クイズ</h1>
  <p>お名前を入力してスタートしてください</p>
  <input id="username" type="text" style="font-size:16px; width:80%; padding:8px; height:20px;" placeholder="例：林康雄">
  <button onclick="startQuiz()">スタート</button>
</div>

<!-- ページ2：クイズ -->
<div id="page-quiz" class="page">
  <div id="question-title"></div>
  <div id="choices"></div>
  <div id="question-image"></div>  
</div>

<!-- ページ3：終了画面 -->
<div id="page-finish" class="page">
  <h2>回答ありがとうございました</h2>

  <!-- ★ 回答一覧をここに表示 -->
  <div id="answer-summary"></div>

  <p id="result-score"></p>  
</div>


<script src="script.js"></script>
</body>
</html>
